name: Tietoturvatarkistus

on:
  schedule:
    # Toteutuva aika riippuu GitHubin jonosta, ks. muut workflow-tiedostot.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  tarkista:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Aja tarkistus
        id: tarkistus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python3 tarkista.py
          echo "koodi=$?" >> "$GITHUB_OUTPUT"

      # 0 = kaikki kunnossa, 1 = huomautettavaa, 2 = kriittinen löydös
      - name: Avaa tai päivitä issue
        if: steps.tarkistus.outputs.koodi != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.tarkistus.outputs.koodi }}" = "2" ]; then
            OTSIKKO="🔴 Tietoturvatarkistus: kriittinen löydös $(date +%-d.%-m.%Y)"
          else
            OTSIKKO="Tietoturvatarkistus: huomautettavaa $(date +%-d.%-m.%Y)"
          fi
          AVOIN=$(gh issue list --label tietoturva --state open \
                    --json number --jq '.[0].number')
          if [ -n "$AVOIN" ]; then
            gh issue comment "$AVOIN" --body-file loydokset.md
            echo "Kommentoitiin issueta #$AVOIN"
          else
            gh issue create --title "$OTSIKKO" \
              --body-file loydokset.md --label tietoturva
          fi

      # Vain kriittinen löydös kaataa ajon, jolloin GitHub lähettää sähköpostin.
      # Pienemmistä riittää issue, jottei viikoittainen versiohuomautus
      # tuota turhaa hälytystä.
      - name: Merkitse ajo epäonnistuneeksi kriittisestä löydöksestä
        if: steps.tarkistus.outputs.koodi == '2'
        run: |
          echo "::error::Tietoturvatarkistus löysi kriittisen puutteen — katso repon issuet."
          exit 1
