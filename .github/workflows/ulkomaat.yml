name: Lataa ulkomaantulokset
on:
  schedule:
    - cron: "43 4 * * *"          # joka yö klo 4.43 UTC, tunti kotimaisen ajon jälkeen
  workflow_dispatch:
    inputs:
      alku:
        description: "Ensimmäinen kuukausi (VVVV-KK) — tyhjä = kuluva vuosi"
        default: ""
      loppu:
        description: "Viimeinen kuukausi (VVVV-KK) — tyhjä = kuluva vuosi"
        default: ""
permissions:
  contents: write
jobs:
  ulkomaat:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - run: python3 wdsf.py ${{ inputs.alku }} ${{ inputs.loppu }}
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git commit -m "Ulkomaantulosten päivitys" || echo "ei muutoksia"
          git pull --rebase
          git push
