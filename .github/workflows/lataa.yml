name: Lataa tulokset
on:
  schedule:
    - cron: "0 1 * * 0"    # sunnuntaiyö klo 1 UTC = la–su yö
    - cron: "0 1 * * 1"    # maanantaiyö klo 1 UTC = su–ma yö
  workflow_dispatch:
    inputs:
      alku:
        description: "Ensimmäinen kilpailunumero"
        default: "890"
      loppu:
        description: "Viimeinen kilpailunumero"
        default: "920"
permissions:
  contents: write
jobs:
  lataa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scrape.py ${{ inputs.alku || '1' }} ${{ inputs.loppu || '1100' }}
      - run: python3 parse.py
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git commit -m "Päivitys" || echo "ei muutoksia"
          git pull --rebase
          git push
