name: Lataa tulokset
on:
  schedule:
    - cron: "37 3 * * *"   # joka yö klo 3.37 UTC (Suomen aikaa 5.37)
  workflow_dispatch:
    inputs:
      alku:
        description: "Ensimmäinen kilpailunumero"
        default: "850"
      loppu:
        description: "Viimeinen kilpailunumero"
        default: "1000"
permissions:
  contents: write
jobs:
  lataa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scrape.py ${{ inputs.alku || '1' }} ${{ inputs.loppu || '1100' }}
      - run: python3 parse.py
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git commit -m "Päivitys" || echo "ei muutoksia"
          git pull --rebase
          git push
